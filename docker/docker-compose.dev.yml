version: "3.9"

services:
  opensearch01:
    image: opensearchproject/opensearch:2.14.0
    container_name: ragflow-opensearch-dev
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 60

  redis:
    image: redis:7
    container_name: ragflow-redis-dev
    command: sh -c "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""
    env_file:
      - ./.env.dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 60

  minio:
    image: minio/minio:latest
    container_name: ragflow-minio-dev
    command: server /data --console-address ":9001"
    env_file:
      - ./.env.dev
    environment:
      - MINIO_ROOT_USER=$${MINIO_USER}
      - MINIO_ROOT_PASSWORD=$${MINIO_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 60

  ragflow:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ragflow-web-dev
    env_file:
      - ./.env.dev
    environment:
      - DOC_ENGINE=opensearch
      - DB_TYPE=postgres
      - OS_HOST=opensearch01
      - REDIS_HOST=redis
      - MINIO_HOST=minio
    depends_on:
      - opensearch01
      - redis
      - minio
    ports:
      - "9380:9380"
    volumes:
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      - ./entrypoint.sh:/ragflow/entrypoint.sh


